name: Update Docker Hub description

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/docker-hub-description.yml'

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # A personal access token needs the Read, Write, Delete scope for this
    - name: Update Docker Hub description
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: keviny86/drupal
        short-description: Drupal-ready PHP + Apache images with Composer, drush cron and graceful shutdown.
        readme-filepath: ./README.md
