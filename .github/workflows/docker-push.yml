name: Build and push docker images

on:
  workflow_dispatch:
  # Weekly rebuild for security updates (paused after 60 days without repo activity)
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - 'drupal/**'
      - 'tests/**'
      - '.hadolint.yaml'
      - '.github/workflows/docker-push.yml'
  # Pull requests are linted and tested, never pushed
  pull_request:
    paths:
      - 'drupal/**'
      - 'tests/**'
      - '.hadolint.yaml'
      - '.github/workflows/docker-push.yml'

permissions:
  contents: read

# Avoid two runs pushing the same tags at once
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Lint
      run: tests/lint.sh

  # Builds, tests and pushes each PHP version
  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      # Still publish the other images if one fails
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      IMAGE: keviny86/drupal:php-${{ matrix.php }}-apache

    # Pinned to SHAs since they get the Docker Hub credentials; updated by Dependabot
    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Scheduled and manual runs build fresh, so tests see the latest packages
    - name: Build image (amd64)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./drupal
        build-args: PHP_VERSION=${{ matrix.php }}
        platforms: linux/amd64
        pull: true
        load: true
        tags: drupal-test:amd64
        no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        cache-from: type=gha,scope=${{ env.IMAGE }}-amd64
        cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-amd64

    - name: Smoke tests
      run: tests/smoke.sh drupal-test:amd64

    - name: Cron and shutdown tests
      run: tests/cron.sh drupal-test:amd64

    - name: Drupal site tests
      run: tests/drupal.sh drupal-test:amd64

    - name: Vulnerability scan
      run: tests/scan.sh drupal-test:amd64

    - name: Build image (arm64)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./drupal
        build-args: PHP_VERSION=${{ matrix.php }}
        platforms: linux/arm64
        pull: true
        load: true
        tags: drupal-test:arm64
        no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        cache-from: type=gha,scope=${{ env.IMAGE }}-arm64
        cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-arm64

    # Full tests under emulation would be very slow
    - name: PHP checks (arm64)
      run: tests/smoke.sh drupal-test:arm64 --php-only

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Dated tag (e.g. php-8.5-apache-20261021) for rollbacks
    - name: Get build date
      if: github.event_name != 'pull_request'
      id: date
      run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    # Reuses the layers built and tested above, so it publishes what was tested
    - name: Push image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./drupal
        build-args: PHP_VERSION=${{ matrix.php }}
        platforms: linux/amd64,linux/arm64
        push: true
        # Annotations aren't inherited by site images, unlike labels
        annotations: |
          index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
          manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
        tags: |
          ${{ env.IMAGE }}
          ${{ env.IMAGE }}-${{ steps.date.outputs.date }}
